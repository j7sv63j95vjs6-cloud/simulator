<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERROR 404 - サッカーゲーム</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .header {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .score-box { color: #00f3ff; }
        .best-box { color: #ffca00; text-align: right; }
        .center-box {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            max-width: 50%;
        }
        .error-title {
            font-size: 14px;
            color: #ff3b30;
            display: block;
            margin-bottom: 5px;
        }
        #game-container {
            position: absolute;
            top: 150px;
            bottom: 220px;
            left: 0;
            right: 0;
        }
        #target-zero {
            position: absolute;
            font-size: 80px;
            font-weight: bold;
            color: #00f3ff;
            cursor: pointer;
            transition: all 0.1s ease;
            transform: translate(-50%, -50%);
            padding: 30px;
            touch-action: none;
        }
        .buttons-container {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 0 20px;
        }
        .share-btn {
            background: linear-gradient(90deg, #00f3ff 50%, #bfff00 50%);
            color: #000;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            width: 80%;
            max-width: 300px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }
        .nav-btn {
            background: #0d0d1a;
            color: #ffca00;
            border: 2px solid #ff3b30;
            padding: 15px 20px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
            width: 90%;
            max-width: 340px;
            text-align: center;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="score-box">SCORE (GOALS)<br><span id="score" style="font-size:24px;">0</span></div>
        <div class="center-box">
            <span class="error-title">ERROR 404</span>
            逃げた 0 からゴールを奪え
        </div>
        <div class="best-box">BEST<br><span id="best" style="font-size:24px;">0</span></div>
    </div>

    <div id="game-container">
        <div id="target-zero">0</div>
    </div>

    <div class="buttons-container">
        <a href="#" id="share-link" class="share-btn">𝕏 記録を𝕏でシェア</a>
        <a href="index.html" class="nav-btn">▶ 他のツールでも遊ぶ ➔ 個人時価総額シミュレーター / FIRE計算機</a>
    </div>

    <script>
        const target = document.getElementById('target-zero');
        const container = document.getElementById('game-container');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const shareLink = document.getElementById('share-link');

        let score = 0;
        let best = localStorage.getItem('football_best') || 0;
        bestEl.textContent = best;

        function moveTarget() {
            const maxX = container.clientWidth - 80;
            const maxY = container.clientHeight - 80;
            const randomX = Math.max(60, Math.floor(Math.random() * maxX));
            const randomY = Math.max(60, Math.floor(Math.random() * maxY));
            target.style.left = randomX + 'px';
            target.style.top = randomY + 'px';
        }

        setTimeout(moveTarget, 300);

        function goal() {
            score++;
            scoreEl.textContent = score;
            if (score > best) {
                best = score;
                bestEl.textContent = best;
                localStorage.setItem('football_best', best);
            }
            updateShareLink();
            moveTarget();
        }

        target.addEventListener('click', goal);
        target.addEventListener('touchstart', function(e) {
            e.preventDefault();
            goal();
        });

        function escape(clientX, clientY) {
            const rect = target.getBoundingClientRect();
            const targetX = rect.left + rect.width / 2;
            const targetY = rect.top + rect.height / 2;
            const dist = Math.hypot(clientX - targetX, clientY - targetY);
            if (dist < 120) { moveTarget(); }
        }

        window.addEventListener('mousemove', (e) => escape(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                escape(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        function updateShareLink() {
            const text = encodeURIComponent(`【ERROR 404】逃げるゼロから ${score} ゴール奪った！お前これ超えられる？ #404ゲーム`);
            const url = encodeURIComponent(window.location.href.split('?')[0]);
            shareLink.href = `https://twitter.com/intent/tweet?text=${text}&url=${url}`;
        }
        updateShareLink();
    </script>
</body>
</html>
