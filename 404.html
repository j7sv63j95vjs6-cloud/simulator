<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#04070A" />
<title>404 GOAL STADIUM — 0を捕まえろ！</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='30' fill='none' stroke='%23FFD54A' stroke-width='22'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root{ --gold:#FFD54A; --emer:#16E0A0; --cyan:#00E5FF; --pink:#FF3D9A; --text:#EAF6FF; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#04070A; }
  body{ font-family:'Noto Sans JP',system-ui,sans-serif; color:var(--text); -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  #game{ position:fixed; inset:0; z-index:0; display:block; touch-action:none; }

  #hud{ position:fixed; top:0; left:0; right:0; z-index:2; pointer-events:none; display:flex; align-items:flex-start; justify-content:space-between; padding:14px 16px; gap:10px; }
  .hud-item{ display:flex; flex-direction:column; line-height:1.1; }
  .hud-item.right{ align-items:flex-end; }
  .hud-item .hl{ font-family:'Space Grotesk',sans-serif; font-size:0.6rem; letter-spacing:0.22em; color:#6f7ea0; margin-bottom:3px; }
  .hud-item .hv{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(1.2rem,5.5vw,1.8rem); font-variant-numeric:tabular-nums; }
  #score{ color:var(--cyan); text-shadow:0 0 12px rgba(0,229,255,0.7); }
  #hi{ color:var(--gold); text-shadow:0 0 12px rgba(255,213,74,0.65); }
  .hud-mid{ text-align:center; font-family:'Space Grotesk',sans-serif; font-size:0.6rem; letter-spacing:0.13em; color:#7a89ad; padding-top:6px; max-width:38%; }

  #bottomUI{ position:fixed; left:0; right:0; bottom:0; z-index:2; pointer-events:none; display:flex; flex-direction:column; align-items:center; gap:10px; padding:12px 16px 16px; }
  .share{ pointer-events:auto; display:inline-flex; align-items:center; justify-content:center; gap:9px; text-decoration:none; font-weight:700; font-size:0.95rem; color:#122; background:linear-gradient(120deg,var(--gold),var(--emer),var(--cyan)); background-size:200% 100%; border-radius:999px; padding:13px 26px; box-shadow:0 8px 26px rgba(22,224,160,0.32), 0 0 34px rgba(255,213,74,0.3); animation:flow 4s linear infinite; transition:transform .12s; max-width:100%; }
  .share:active{ transform:scale(0.97); }
  @keyframes flow{ to{ background-position:200% 0; } }
  .banner{ pointer-events:auto; display:block; text-decoration:none; text-align:center; max-width:540px; width:100%; color:#DCEBFF; font-size:0.85rem; font-weight:500; padding:12px 14px; border-radius:14px; border:1px solid rgba(255,61,154,0.5); background:linear-gradient(180deg, rgba(255,61,154,0.10), rgba(0,229,255,0.05)); box-shadow:0 0 20px rgba(255,61,154,0.22), inset 0 0 16px rgba(0,229,255,0.06); animation:bglow 3.4s ease-in-out infinite; transition:transform .12s; }
  .banner b{ color:var(--gold); font-weight:700; }
  .banner:active{ transform:scale(0.99); }
  @keyframes bglow{ 0%,100%{ box-shadow:0 0 16px rgba(255,61,154,0.18), inset 0 0 14px rgba(0,229,255,0.05); } 50%{ box-shadow:0 0 30px rgba(255,213,74,0.32), inset 0 0 20px rgba(0,229,255,0.10); } }
  @media (prefers-reduced-motion:reduce){ .share,.banner{ animation:none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-item"><span class="hl">SCORE (GOALS)</span><span class="hv" id="score">0</span></div>
  <div class="hud-mid">ERROR 404 — 逃げた 0 からゴールを奪え</div>
  <div class="hud-item right"><span class="hl">BEST</span><span class="hv" id="hi">0</span></div>
</div>

<div id="bottomUI">
  <a class="share" id="share" href="#" target="_blank" rel="noopener noreferrer">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.451-6.231zm-1.161 17.52h1.833L7.084 4.126H5.117l11.966 15.644z"/></svg>
    記録をXでシェア
  </a>
  <!-- ▼ 誘導バナー：href とテキストをあなたの本命ページに差し替えてください ▼ -->
  <a class="banner" id="banner" href="#">▶ 他のツールでも遊ぶ <b>→ 個人時価総額シミュレーター / FIRE計算機</b></a>
</div>

<!-- ここにGoogle AdSenseなどの広告コードを貼り付ける -->
<div id="adSlot" style="display:none"></div>

<script>
(function(){
"use strict";
var RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var $ = function(id){ return document.getElementById(id); };
var cv = $("game"), ctx = cv.getContext("2d");
var scoreEl = $("score"), hiEl = $("hi"), shareEl = $("share");

var STAD = ["#FFD54A","#16E0A0","#00E5FF","#FF3D9A","#FFFFFF","#FFB000"];
var STAD_RGB = [[255,213,74],[22,224,160],[0,229,255],[255,61,154],[255,255,255]];
var FLASHC = ["255,213,74","0,229,255","255,61,154","22,224,160"];

/* persistence */
var best = 0;
(function(){ try{ best = parseInt(localStorage.getItem("goal404_best"),10)||0; }catch(e){} })();
function saveBest(){ try{ localStorage.setItem("goal404_best", String(best)); }catch(e){} }

/* state */
var W=0,H=0,DPR=1;
var phase="intro", introT=1.4;
var goals=0, comboTimer=0, COMBO_WINDOW=1.6;
var shake=0, flash=0, flashCol="255,213,74";
var L=0,Rt=0,T=0,B=0;
var zero={ x:0,y:0,vx:0,vy:0,r:34,tx:0,ty:0,wT:0,spin:0 };
var px=-9999,py=-9999,pT=-99;
var conf=[], sparks=[], pops=[], amb=[], shocks=[];
var goalPop=null;
var t=0, last=0, raf=0;
var flood=[];

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W+"px"; cv.style.height = H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  var hudH=($("hud").offsetHeight)||64, botH=($("bottomUI").offsetHeight)||132;
  zero.r = Math.max(26, Math.min(48, Math.min(W,H)*0.062));
  L=zero.r+10; Rt=W-zero.r-10; T=hudH+zero.r+14; B=H-botH-zero.r-12;
  if (B<T+60) B=T+60;
  // ambient floating particles
  amb.length=0;
  var n=Math.floor(W*H/13000);
  for (var i=0;i<n;i++){
    amb.push({ x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10, r:Math.random()*1.7+0.6, ph:Math.random()*6.28, sp:0.5+Math.random()*1.3, c:STAD[(Math.random()*STAD.length)|0] });
  }
  flood=[{x:W*0.16,y:-30},{x:W*0.84,y:-30}];
  if (phase==="intro"){ zero.x=W/2; zero.y=Math.min(H*0.44,(T+B)/2); }
}

/* helpers */
function hotRGB(g){
  var stops=[[255,213,74],[0,229,255],[255,61,154],[255,60,60]];
  var f=Math.min(g/8,1)*(stops.length-1), i=Math.floor(f), fr=f-i;
  if(i>=stops.length-1) return stops[stops.length-1].join(",");
  var a=stops[i], b=stops[i+1];
  return Math.round(a[0]+(b[0]-a[0])*fr)+","+Math.round(a[1]+(b[1]-a[1])*fr)+","+Math.round(a[2]+(b[2]-a[2])*fr);
}
function goalText(g){
  if (g<=1) return "GOAL!!";
  if (g===2) return "DOUBLE!!";
  if (g===3) return "HAT TRICK!";
  if (g===4) return "SUPER GOAL!!";
  if (g===5) return "WONDER GOAL!!";
  if (g===6) return "GOLAZO!!!";
  return "UNSTOPPABLE!!";
}
function updateHUD(){ scoreEl.textContent=goals.toLocaleString("ja-JP"); hiEl.textContent=best.toLocaleString("ja-JP"); }
function pickTarget(){ zero.tx=L+Math.random()*(Rt-L); zero.ty=T+Math.random()*(B-T); }
function buildShare(){
  var origin = /^https?:$/.test(location.protocol) ? location.origin+location.pathname : "";
  var boast = best>=3 ? "ハットトリック達成！" : "";
  var txt = "404エラーページで逃げ出した【0】から"+best+"ゴールを奪い取った！"+boast+" #404GOALSTADIUM";
  shareEl.href = "https://x.com/intent/post?text="+encodeURIComponent(txt)+(origin?"&url="+encodeURIComponent(origin):"");
}
buildShare(); updateHUD();

/* effects */
function boom(x,y,intensity){
  var m=Math.max(1,Math.min(intensity,6));
  var nc=Math.round((RM?15:36)*m);
  for (var i=0;i<nc;i++){
    var a=Math.random()*6.2832, sp=(RM?120:200)+Math.random()*(RM?190:420)*Math.min(m,4);
    conf.push({ x:x,y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-80, w:5+Math.random()*7, h:9+Math.random()*11, rot:Math.random()*6.28, vr:(Math.random()-0.5)*13, col:STAD[(Math.random()*STAD.length)|0], life:1.5+Math.random()*1.5, sway:Math.random()*6.28 });
  }
  var ns=Math.round((RM?7:14)*m);
  for (i=0;i<ns;i++){
    var a2=Math.random()*6.2832, sp2=220+Math.random()*560;
    sparks.push({ x:x,y:y, vx:Math.cos(a2)*sp2, vy:Math.sin(a2)*sp2, life:0.4+Math.random()*0.45, r:2+Math.random()*2.6, c:STAD_RGB[(Math.random()*STAD_RGB.length)|0] });
  }
  if (conf.length>470) conf.splice(0,conf.length-470);
  if (sparks.length>250) sparks.splice(0,sparks.length-250);
}
function addShock(x,y,intensity){ shocks.push({ x:x,y:y, r:0, age:0, life:0.9, str:900+intensity*160, col:FLASHC[(Math.random()*FLASHC.length)|0] }); }

/* goal / streak */
function hitR2(){ var d=zero.r+18; return d*d; }
function doGoal(){
  goals++;
  if (goals>best){ best=goals; saveBest(); buildShare(); }
  comboTimer=COMBO_WINDOW;
  var cx=zero.x, cy=zero.y;
  boom(cx,cy, 1+goals*0.5);
  addShock(cx,cy, goals);
  goalPop={ t:0, life:1.1, text:goalText(goals) };
  pops.push({ x:cx, y:cy-zero.r-4, t:0, life:0.8, main:"+1", col:"255,213,74" });
  flash=Math.min(0.34+goals*0.05, 0.85); flashCol=FLASHC[(Math.random()*FLASHC.length)|0];
  shake=Math.min(8+goals*1.8, 28);
  // shift the ball to a fresh spot, faster each goal
  var nx,ny,tries=0;
  do{ nx=L+Math.random()*(Rt-L); ny=T+Math.random()*(B-T); tries++; } while(tries<8 && (nx-px)*(nx-px)+(ny-py)*(ny-py)<160*160);
  zero.x=nx; zero.y=ny;
  var mv=maxSpeed()*0.6, ang=Math.random()*6.2832;
  zero.vx=Math.cos(ang)*mv; zero.vy=Math.sin(ang)*mv;
  pickTarget(); updateHUD();
}
function endStreak(){
  if (goals>=2){ goalPop={ t:0, life:1.1, text:goals+" ゴールでタイムアップ！", small:true }; shake=Math.max(shake,6); }
  goals=0; comboTimer=0; updateHUD();
}

/* movement */
function maxSpeed(){ return Math.min(160 + goals*24, 690) * (RM?0.6:1); }
function moveZero(
