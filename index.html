<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#030509" />
<title>個人時価総額シミュレーター — BRAND NEW ME</title>
<meta name="description" content="もし明日あなたが上場したら、時価総額はいくら？ 年齢・職種・スキル・努力時間から初値株価と時価総額を算出。生きているだけで毎秒価値が増え続けるホログラム演出付き。" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:    #030509;
    --neon:  #54A9FF;   /* neon blue */
    --teal:  #2FE6D6;   /* cyber teal */
    --text:  #EAF2FF;
    --muted: #7C8CA8;
    --panel: rgba(9,16,30,0.55);
    --line:  rgba(84,169,255,0.22);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg); }
  body{
    font-family:'Noto Sans JP',system-ui,-apple-system,sans-serif; color:var(--text);
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  }
  #fx{ position:fixed; inset:0; z-index:0; display:block; touch-action:none; }

  /* stage overlay — passes taps through to canvas, children capture their own */
  .stage{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    display:flex; align-items:center; justify-content:center; padding:22px;
  }
  .panel{
    pointer-events:auto; width:100%; max-width:460px;
    background:var(--panel); border:1px solid var(--line); border-radius:22px;
    padding:26px 22px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    box-shadow:0 0 0 1px rgba(47,230,214,0.06), 0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(84,169,255,0.10);
    max-height:calc(100vh - 44px); overflow-y:auto;
  }

  .eyebrow{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:0.68rem;
    letter-spacing:0.34em; color:var(--teal); margin:0 0 8px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(1.9rem,7vw,2.5rem);
    letter-spacing:0.02em; margin:0; line-height:1.1;
    background:linear-gradient(100deg, #00F0FF, #FF00E5, #FFE000, #9D4DFF, #00F0FF);
    background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
    filter:drop-shadow(0 0 22px rgba(255,0,229,0.5)) drop-shadow(0 0 12px rgba(0,240,255,0.45));
    animation:hueflow 6s linear infinite;
  }
  @keyframes hueflow{ to{ background-position:300% 0; } }
  .sub{ color:var(--muted); font-size:0.88rem; margin:10px 0 22px; }

  .field{ margin-bottom:20px; }
  .field-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .field-top .fl{ font-size:0.86rem; font-weight:500; color:#C6D3EA; }
  .field-top b{ font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--teal); font-variant-numeric:tabular-nums; font-size:0.98rem; }

  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:30px; background:transparent; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track{ height:5px; border-radius:999px; background:linear-gradient(90deg, var(--teal) var(--fill,0%), rgba(120,140,170,0.22) var(--fill,0%)); }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; margin-top:-7.5px; border-radius:50%; background:#EAF2FF; box-shadow:0 0 12px rgba(47,230,214,0.8), 0 0 0 4px rgba(47,230,214,0.16); transition:transform .1s; }
  input[type=range]:active::-webkit-slider-thumb{ transform:scale(1.15); }
  input[type=range]::-moz-range-track{ height:5px; border-radius:999px; background:rgba(120,140,170,0.22); }
  input[type=range]::-moz-range-progress{ height:5px; border-radius:999px; background:var(--teal); }
  input[type=range]::-moz-range-thumb{ width:20px; height:20px; border:none; border-radius:50%; background:#EAF2FF; box-shadow:0 0 12px rgba(47,230,214,0.8), 0 0 0 4px rgba(47,230,214,0.16); }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    flex:1 1 auto; min-width:calc(50% - 5px);
    appearance:none; border:1px solid var(--line); background:rgba(84,169,255,0.05);
    color:#AEBEDA; font:inherit; font-size:0.86rem; font-weight:500;
    padding:11px 10px; border-radius:12px; cursor:pointer; text-align:center;
    transition:all .16s;
  }
  .chips.three .chip{ min-width:calc(33.333% - 6px); }
  .chip:hover{ color:#EAF2FF; border-color:rgba(84,169,255,0.5); }
  .chip.on{
    color:#04121A; font-weight:700; border-color:transparent;
    background:linear-gradient(120deg, var(--neon), var(--teal));
    box-shadow:0 0 22px rgba(47,230,214,0.35);
  }

  .sim, .retry{
    display:block; width:100%; margin-top:8px; appearance:none; border:none; cursor:pointer;
    font-family:'Space Grotesk','Noto Sans JP',sans-serif; font-weight:700; font-size:1.05rem; letter-spacing:0.04em;
    color:#04121A; padding:16px; border-radius:14px;
    background:linear-gradient(120deg, #00F0FF, #FF00E5, #FFE000);
    background-size:200% 100%;
    box-shadow:0 8px 26px rgba(255,0,229,0.35), 0 0 44px rgba(0,240,255,0.28);
    animation:btnflow 4s linear infinite;
    transition:transform .12s, box-shadow .3s;
  }
  .sim:active, .retry:active{ transform:scale(0.98); }
  @keyframes btnflow{ to{ background-position:200% 0; } }
  .hint{ text-align:center; color:var(--muted); font-size:0.72rem; margin:14px 0 0; letter-spacing:0.02em; }

  /* ---------- input <-> result transitions ---------- */
  #inputView{ transition:opacity .35s, transform .35s; }
  #inputView.gone{ opacity:0; transform:scale(0.92) translateY(10px); pointer-events:none; }
  #resultView{ position:absolute; }
  #resultView.hidden{ display:none; }
  #resultView.in{ animation:popin .7s cubic-bezier(.18,.7,.3,1); }
  @keyframes popin{ 0%{ opacity:0; transform:scale(0.8); filter:blur(6px); } 60%{ opacity:1; filter:blur(0); } 100%{ transform:scale(1); } }

  /* ---------- result ---------- */
  .result{ text-align:center; }
  .r-label{ font-family:'Space Grotesk',sans-serif; font-size:0.72rem; letter-spacing:0.24em; color:var(--teal); margin:0 0 10px; }
  .rank{ margin:0 0 12px; opacity:0; }
  .rank.bam{ animation:bam .7s cubic-bezier(.2,.85,.25,1) both; }
  .rank-badge{ display:inline-block; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:0.86rem; letter-spacing:0.1em;
    padding:3px 13px; border-radius:999px; color:#04070E; background:rgb(var(--rk,0,240,255)); margin-bottom:9px;
    box-shadow:0 0 22px rgba(var(--rk,0,240,255),0.75); }
  .rank-title{ display:block; font-weight:700; font-size:clamp(1.3rem,6.6vw,2rem); line-height:1.15;
    color:#fff; text-shadow:0 0 12px #fff, 0 0 26px rgba(var(--rk,0,240,255),0.9), 0 0 56px rgba(var(--rk,0,240,255),0.6); }
  @keyframes bam{ 0%{ opacity:0; transform:scale(2.4); filter:blur(8px); } 45%{ opacity:1; transform:scale(0.86); filter:blur(0); } 70%{ transform:scale(1.09); } 100%{ opacity:1; transform:scale(1); } }
  .cap{
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:clamp(1.7rem, 8.4vw, 3rem); line-height:1.05; letter-spacing:-0.01em;
    white-space:nowrap; font-variant-numeric:tabular-nums;
    color:#FFFFFF;
    text-shadow:0 0 10px #fff, 0 0 26px rgba(0,240,255,0.85), 0 0 46px rgba(255,0,229,0.6), 0 0 72px rgba(157,77,255,0.5);
    animation:capglow 2.6s ease-in-out infinite;
  }
  @keyframes capglow{ 50%{ text-shadow:0 0 14px #fff, 0 0 34px rgba(255,224,0,0.85), 0 0 56px rgba(0,240,255,0.6), 0 0 82px rgba(255,0,229,0.5); } }
  .cap-sub{ font-size:1rem; font-weight:700; color:var(--teal); margin:8px 0 20px; }
  .r-row{ display:flex; gap:12px; margin-bottom:20px; }
  .r-row > div{ flex:1; background:rgba(84,169,255,0.06); border:1px solid var(--line); border-radius:14px; padding:12px 8px; }
  .rk{ display:block; font-size:0.72rem; color:var(--muted); margin-bottom:5px; }
  .rv{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.15rem; font-variant-numeric:tabular-nums; color:#EAF2FF; }
  .rv.teal{ color:var(--teal); }

  .share{
    display:inline-flex; align-items:center; justify-content:center; gap:9px; width:100%;
    text-decoration:none; box-sizing:border-box;
    font-weight:700; font-size:0.98rem; color:#04121A;
    background:linear-gradient(120deg, var(--teal), var(--neon)); border-radius:14px; padding:14px;
    box-shadow:0 10px 28px rgba(47,230,214,0.3); transition:transform .12s;
  }
  .share:active{ transform:scale(0.98); }

  /* neon banner — replace href / text with your own */
  .banner{
    display:block; margin-top:14px; text-decoration:none; text-align:center;
    color:#FFE9C0; font-size:0.9rem; font-weight:600; letter-spacing:0.01em;
    padding:15px 12px; border-radius:14px; position:relative; overflow:hidden;
    border:1px solid rgba(255,193,17,0.6);
    background:linear-gradient(180deg, rgba(255,0,120,0.10), rgba(255,193,17,0.07));
    text-shadow:0 0 12px rgba(255,193,17,0.5);
    animation:bannerGlow 1.6s ease-in-out infinite; transition:transform .12s;
  }
  .banner:hover{ color:#fff; }
  .banner:active{ transform:scale(0.99); }
  .banner b{ color:#FFD54A; font-weight:700; }
  @keyframes bannerGlow{
    0%,100%{ box-shadow:0 0 14px rgba(255,193,17,0.25), inset 0 0 16px rgba(255,0,120,0.06); border-color:rgba(255,193,17,0.5); }
    50%{ box-shadow:0 0 34px rgba(255,0,120,0.55), 0 0 60px rgba(255,193,17,0.35), inset 0 0 22px rgba(255,193,17,0.12); border-color:rgba(255,0,120,0.95); }
  }

  .retry{ margin-top:16px; background:none; border:1px solid var(--line); color:#AEBEDA; box-shadow:none; font-weight:600; }
  .retry:hover{ border-color:rgba(84,169,255,0.5); color:#EAF2FF; }

  .panel::-webkit-scrollbar{ width:0; }

  @media (prefers-reduced-motion:reduce){
    #resultView.in{ animation:none; }
    .banner{ animation:none; }
    .rank{ opacity:1; }
    .rank.bam{ animation:none; }
  }
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div class="stage">
  <!-- 入力 -->
  <section id="inputView" class="panel">
    <p class="eyebrow">PERSONAL VALUATION</p>
    <h1>BRAND NEW ME</h1>
    <p class="sub">もし明日、あなたが株式市場に上場したら——<br>その時価総額を算出します。</p>

    <div class="field">
      <div class="field-top"><span class="fl">現在の年齢</span><b><span id="v-age">30</span> 歳</b></div>
      <input type="range" id="f-age" min="18" max="65" step="1" value="30" />
    </div>

    <div class="field">
      <div class="field-top"><span class="fl">職種ジャンル</span></div>
      <div class="chips" id="genre">
        <button class="chip on" data-g="tech">技術職</button>
        <button class="chip" data-g="biz">ビジネス職</button>
        <button class="chip" data-g="art">クリエイティブ</button>
        <button class="chip" data-g="etc">学生・その他</button>
      </div>
    </div>

    <div class="field">
      <div class="field-top"><span class="fl">自慢のスキルレベル</span></div>
      <div class="chips three" id="skill">
        <button class="chip" data-s="1">★<br><span style="font-size:.76rem">初級</span></button>
        <button class="chip on" data-s="2">★★<br><span style="font-size:.76rem">中級</span></button>
        <button class="chip" data-s="3">★★★<br><span style="font-size:.76rem">上級</span></button>
      </div>
    </div>

    <div class="field">
      <div class="field-top"><span class="fl">1日のインプット・努力時間</span><b><span id="v-hours">3.0</span> 時間</b></div>
      <input type="range" id="f-hours" min="0" max="8" step="0.5" value="3" />
    </div>

    <button class="sim" id="sim">シミュレート</button>
    <p class="hint">背景をタップすると光の粒子が弾けます</p>
  </section>

  <!-- 結果 -->
  <section id="resultView" class="panel result hidden">
    <p class="r-label">あなたの時価総額 / MARKET CAP</p>
    <div class="rank" id="rank"><span class="rank-badge" id="rankBadge">SSR</span><span class="rank-title" id="rankTitle">—</span></div>
    <div class="cap" id="capNum">¥0</div>
    <p class="cap-sub" id="capSub">—</p>
    <div class="r-row">
      <div><span class="rk">初値株価</span><span class="rv" id="v-price">¥0</span></div>
      <div><span class="rk">毎秒の創出価値</span><span class="rv teal" id="v-rate">+¥0</span></div>
    </div>
    <a class="share" id="share" href="#" target="_blank" rel="noopener noreferrer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.451-6.231zm-1.161 17.52h1.833L7.084 4.126H5.117l11.966 15.644z"/></svg>
      結果をXでシェア
    </a>
    <!-- ▼ 誘導バナー：href とテキストをあなたのページ用に差し替えてください ▼ -->
    <a class="banner" id="banner" href="#">⚠️ 警告：あなたの時価総額を、現実の『不労所得』に変える<b>裏ルート</b>が存在します。 ➡️ <b>FIRE達成ロードマップを解禁する</b></a>
    <button class="retry" id="retry">もう一度シミュレート</button>
  </section>
</div>

<!-- ここにGoogle AdSenseなどの広告コードを貼り付ける -->
<div id="adSlot" style="display:none"></div>

<script>
(function(){
"use strict";
var RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var $ = function(id){ return document.getElementById(id); };

/* =========================================================
   STATE & VALUATION
   ========================================================= */
var state = { age: 30, genre: "tech", skill: 2, hours: 3 };
var GENRE_MULT = { tech: 1.5, biz: 1.4, art: 1.25, etc: 1.15 };
var GENRE_IDX  = { tech: 0, biz: 1, art: 2, etc: 3 };
var SKILL_MULT = { 1: 1.0, 2: 1.8, 3: 3.0 };
var SHARES = 1000000; // 100万株
var result = { cap: 0, price: 0, rate: 0 };

function compute(){
  var g = GENRE_MULT[state.genre];
  var sk = SKILL_MULT[state.skill];
  var h = state.hours;
  var effort = 0.7 + Math.pow(h, 1.2) * 0.35;
  var youth = Math.max(0, (45 - state.age)) / 45;   // 成長期待（若いほど高い）
  var exp = (state.age - 18) / 47;                  // 経験プレミアム
  var ageM = 0.9 + youth * 0.9 + exp * 0.25;
  var seed = (state.age * 131 + GENRE_IDX[state.genre] * 977 + state.skill * 613 + Math.round(h * 10) * 397) % 1000;
  var jitter = 0.88 + (seed / 1000) * 0.24;         // 0.88〜1.12（入力で決定＝再現性あり）
  var cap = 160000000 * g * sk * effort * ageM * jitter;
  cap = Math.max(150000000, Math.min(cap, 9900000000)); // 1.5億〜99億
  cap = Math.round(cap);
  var price = Math.round(cap / SHARES);
  var rate = Math.round(Math.max(30, Math.min(cap / 20000000, 600))); // 毎秒 数十〜数百円
  return { cap: cap, price: price, rate: rate };
}

function fullYen(v){ return "¥" + Math.floor(v).toLocaleString("ja-JP"); }
function okuMan(v){
  v = Math.round(v);
  var oku = Math.floor(v / 1e8), man = Math.round((v % 1e8) / 1e4);
  if (man >= 10000){ oku += 1; man -= 10000; }
  var s = "";
  if (oku > 0) s += oku + "億";
  if (man > 0) s += man + "万";
  return (s || "0") + "円";
}

/* =========================================================
   PARTICLES — holographic rotating point cloud (2500)
   ========================================================= */
var cv = $("fx"), ctx = cv.getContext("2d", { alpha: false });
var W = 0, H = 0, DPR = 1, R = 0, FL = 0, ctrX = 0, ctrY = 0;
var N = 2500;
var ux = new Float32Array(N), uy = new Float32Array(N), uz = new Float32Array(N), shell = new Float32Array(N);
var xA = new Float32Array(N), yA = new Float32Array(N), vxA = new Float32Array(N), vyA = new Float32Array(N);
var dep = new Float32Array(N), scP = new Float32Array(N), colA = new Uint8Array(N);
var hoff = new Float32Array(N);
// dynamic neon palette: cyan -> magenta -> sunshine yellow -> purple (loops), pre-rendered as glow sprites
var KEYCOL = [[0,240,255],[255,0,229],[255,224,0],[157,77,255]];
var STEPS = 36, SPR = [];
(function buildGlowSprites(){
  for (var s = 0; s < STEPS; s++){
    var ph = s / STEPS * KEYCOL.length, seg = Math.floor(ph), fr = ph - seg;
    var a = KEYCOL[seg % KEYCOL.length], b = KEYCOL[(seg + 1) % KEYCOL.length];
    var rgb = Math.round(a[0]+(b[0]-a[0])*fr) + "," + Math.round(a[1]+(b[1]-a[1])*fr) + "," + Math.round(a[2]+(b[2]-a[2])*fr);
    var c = document.createElement("canvas"); c.width = c.height = 32;
    var g = c.getContext("2d");
    var rad = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    rad.addColorStop(0, "rgba(" + rgb + ",1)");
    rad.addColorStop(0.35, "rgba(" + rgb + ",0.6)");
    rad.addColorStop(1, "rgba(" + rgb + ",0)");
    g.fillStyle = rad; g.beginPath(); g.arc(16, 16, 16, 0, 6.2832); g.fill();
    SPR.push(c);
  }
})();

(function initCloud(){
  var GA = Math.PI * (3 - Math.sqrt(5)); // golden angle
  for (var i = 0; i < N; i++){
    var yy = 1 - (i / (N - 1)) * 2;
    var rad = Math.sqrt(Math.max(0, 1 - yy * yy));
    var th = i * GA;
    ux[i] = Math.cos(th) * rad; uy[i] = yy; uz[i] = Math.sin(th) * rad;
    shell[i] = 0.82 + Math.random() * 0.18;
    colA[i] = Math.random() < 0.52 ? 0 : 1;
    hoff[i] = Math.random();
  }
})();

function resize(){
  DPR = Math.min(1.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#030509"; ctx.fillRect(0, 0, W, H);
  ctrX = W / 2; ctrY = H / 2;
  R = Math.min(W, H) * 0.32; FL = R * 3.2;
  if (!seeded){ for (var i = 0; i < N; i++){ xA[i] = ctrX + (Math.random() - 0.5) * W; yA[i] = ctrY + (Math.random() - 0.5) * H; } seeded = true; }
}
var seeded = false;

/* ripples */
var ripples = [];
function addRipple(x, y){
  if (ripples.length > 14) ripples.shift();
  ripples.push({ x: x, y: y, rad: 0, age: 0, life: 1.2, str: 2.4 });
}

/* confetti — stadium-goal celebration burst (visual only) */
var confetti = [];
var CONF_COLORS = ["#00F0FF", "#FF00E5", "#FFE000", "#9D4DFF", "#00FF9D", "#FF6A2C", "#FFFFFF", "#2FE6D6"];
function burstConfetti(){
  var n = RM ? 90 : 240;
  for (var i = 0; i < n; i++){
    var top = i < n * 0.58, x, y, vx, vy;
    if (top){ x = Math.random() * W; y = -20 - Math.random() * H * 0.35; vx = (Math.random() - 0.5) * 90; vy = 130 + Math.random() * 170; }
    else { var a = Math.random() * 6.2832, sp = 200 + Math.random() * 340; x = ctrX; y = ctrY; vx = Math.cos(a) * sp; vy = Math.sin(a) * sp - 140; }
    confetti.push({ x: x, y: y, vx: vx, vy: vy, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 11,
      w: 5 + Math.random() * 7, h: 8 + Math.random() * 9, col: CONF_COLORS[(Math.random() * CONF_COLORS.length) | 0],
      life: 2.8 + Math.random() * 2.0, sway: Math.random() * 6.28 });
  }
}

/* mode machine */
var mode = "ambient";      // ambient | converge | result
var convT = 0, CONV = 0.62;
var flashA = 0, ring = null;
var displayed = 0;
var angY = 0;

var BAND = 46, SIG2 = 2 * 22 * 22;
var last = 0, t = 0, raf = 0;

function frame(now){
  raf = requestAnimationFrame(frame);
  var dt = Math.min(50, now - last) / 1000; last = now;
  t += dt;

  // light trail
  ctx.fillStyle = "rgba(3,5,9,0.30)";
  ctx.fillRect(0, 0, W, H);

  // ripples advance
  var i, r, k;
  for (i = ripples.length - 1; i >= 0; i--){
    r = ripples[i]; r.age += dt; r.rad += (RM ? 150 : 300) * dt;
    if (r.age > r.life) ripples.splice(i, 1);
  }

  // mode timing
  var stiff = 0.09;
  if (mode === "converge"){
    convT += dt;
    stiff = 0.12 + (convT / CONV) * 0.55;
    if (convT >= CONV){ fireReveal(); }
  } else if (mode === "result"){
    stiff = 0.10;
    displayed += result.rate * dt;
    $("capNum").textContent = fullYen(displayed);
    $("capSub").textContent = okuMan(displayed);
  }

  // rotate
  angY += dt * (mode === "converge" ? 1.6 : 0.35);
  var cosY = Math.cos(angY), sinY = Math.sin(angY);
  var tilt = 0.42 + 0.12 * Math.sin(t * 0.3);
  var cosT = Math.cos(tilt), sinT = Math.sin(tilt);
  var conv = (mode === "converge");

  for (i = 0; i < N; i++){
    var Rr = R * shell[i];
    var bx = ux[i] * Rr, by = uy[i] * Rr, bz = uz[i] * Rr;
    var rx = bx * cosY + bz * sinY, rz = -bx * sinY + bz * cosY;
    var ry2 = by * cosT - rz * sinT, rz2 = by * sinT + rz * cosT;
    var sc = FL / (FL + rz2);
    var hx = ctrX + rx * sc, hy = ctrY + ry2 * sc;
    dep[i] = rz2; scP[i] = sc;

    var tx = conv ? ctrX : hx, ty = conv ? ctrY : hy;
    vxA[i] += (tx - xA[i]) * stiff;
    vyA[i] += (ty - yA[i]) * stiff;

    for (k = 0; k < ripples.length; k++){
      r = ripples[k];
      var dx = xA[i] - r.x, dy = yA[i] - r.y;
      var dist = Math.sqrt(dx * dx + dy * dy) || 0.001;
      var dr = dist - r.rad;
      if (dr > -BAND && dr < BAND){
        var f = r.str * (1 - r.age / r.life) * Math.exp(-(dr * dr) / SIG2);
        vxA[i] += dx / dist * f; vyA[i] += dy / dist * f;
      }
    }
    vxA[i] *= 0.84; vyA[i] *= 0.84;
    xA[i] += vxA[i]; yA[i] += vyA[i];
  }

  // draw — glowing neon dots; hue cycles cyan->magenta->yellow->purple by time & speed
  ctx.globalCompositeOperation = "lighter";
  for (i = 0; i < N; i++){
    var dN = (dep[i] / R + 1) * 0.5; if (dN < 0) dN = 0; else if (dN > 1) dN = 1;
    var spd = Math.abs(vxA[i]) + Math.abs(vyA[i]);
    var ph = t * 0.05 + hoff[i] + spd * 0.02; ph = ph - Math.floor(ph);
    var bkt = (ph * STEPS) | 0; if (bkt >= STEPS) bkt = STEPS - 1;
    var sz = (1.4 + dN * 3.0) * scP[i];
    ctx.globalAlpha = 0.4 + dN * 0.6;
    ctx.drawImage(SPR[bkt], xA[i] - sz * 0.5, yA[i] - sz * 0.5, sz, sz);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";

  // flash ring (additive)
  if (ring){
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = "rgba(150,235,255," + ring.a + ")";
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(ctrX, ctrY, ring.r, 0, 6.2832); ctx.stroke();
    ctx.globalCompositeOperation = "source-over";
    ring.r += 1100 * dt; ring.a -= dt * 1.5;
    if (ring.a <= 0) ring = null;
  }

  // white flash
  if (flashA > 0.001){
    ctx.fillStyle = "rgba(230,245,255," + flashA + ")";
    ctx.fillRect(0, 0, W, H);
    flashA -= dt * 3.0; if (flashA < 0) flashA = 0;
  }

  // confetti — celebration, drawn on top
  if (confetti.length){
    ctx.globalCompositeOperation = "source-over";
    for (i = confetti.length - 1; i >= 0; i--){
      var cf = confetti[i];
      cf.life -= dt;
      if (cf.life <= 0 || cf.y > H + 40){ confetti.splice(i, 1); continue; }
      cf.vy += 340 * dt; cf.vx *= 0.99; cf.sway += dt * 6;
      cf.x += (cf.vx + Math.sin(cf.sway) * 46) * dt; cf.y += cf.vy * dt; cf.rot += cf.vr * dt;
      ctx.save();
      ctx.translate(cf.x, cf.y); ctx.rotate(cf.rot);
      ctx.globalAlpha = Math.min(1, cf.life * 1.3);
      ctx.fillStyle = cf.col;
      ctx.fillRect(-cf.w * 0.5, -cf.h * 0.5, cf.w, cf.h);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
}

/* ---------- rarity / titles (marketing hack #1) ---------- */
var RANKS = [
  { min:0,          rank:"R",    title:"磨けば光る原石",           rgb:"0,229,255" },
  { min:300000000,  rank:"R+",   title:"静かなる実力者",           rgb:"0,240,180" },
  { min:600000000,  rank:"SR",   title:"業界注目の逸材",           rgb:"84,169,255" },
  { min:1000000000, rank:"SR+",  title:"時代の寵児",               rgb:"157,77,255" },
  { min:1800000000, rank:"SSR",  title:"時代を動かす天才",         rgb:"255,0,229" },
  { min:3000000000, rank:"SSR+", title:"次世代のイーロン・マスク", rgb:"255,180,0" },
  { min:5000000000, rank:"UR",   title:"国宝級の唯一無二",         rgb:"255,213,74" },
  { min:7500000000, rank:"LR",   title:"神域の創造主",             rgb:"255,120,220" }
];
function getRank(cap){ var r = RANKS[0]; for (var i = 0; i < RANKS.length; i++){ if (cap >= RANKS[i].min) r = RANKS[i]; } return r; }

function fireReveal(){
  mode = "result";
  flashA = 0.9; ring = { r: 0, a: 1 };
  burstConfetti();
  displayed = result.cap;
  $("v-price").textContent = fullYen(result.price);
  $("v-rate").textContent = "+" + fullYen(result.rate);
  $("capNum").textContent = fullYen(result.cap);
  $("capSub").textContent = okuMan(result.cap);
  var rk = getRank(result.cap);
  $("rankBadge").textContent = rk.rank;
  $("rankTitle").textContent = rk.title;
  var rankEl = $("rank"); rankEl.style.setProperty("--rk", rk.rgb);
  rankEl.classList.remove("bam"); void rankEl.offsetWidth; rankEl.classList.add("bam");
  buildShare();
  var rv = $("resultView");
  rv.classList.remove("hidden");
  void rv.offsetWidth;
  rv.classList.add("in");
}

function buildShare(){
  var origin = /^https?:$/.test(location.protocol) ? (location.origin + location.pathname) : "";
  var rk = getRank(result.cap);
  var txt = "私の時価総額は【" + rk.rank + "：" + okuMan(result.cap) + "】\uD83D\uDD25 称号は『" + rk.title + "』。…これ超えられる奴、いる？ スマホで今すぐ自分の価値を測れ！ #個人時価総額シミュレーター";
  var href = "https://x.com/intent/post?text=" + encodeURIComponent(txt) + (origin ? "&url=" + encodeURIComponent(origin) : "");
  $("share").href = href;
}

/* =========================================================
   INPUT WIRING
   ========================================================= */
function fillSlider(el){ var mn = +el.min, mx = +el.max, v = +el.value; el.style.setProperty("--fill", (mx > mn ? (v - mn) / (mx - mn) * 100 : 0) + "%"); }

var ageEl = $("f-age"), hoursEl = $("f-hours");
ageEl.addEventListener("input", function(){ state.age = +ageEl.value; $("v-age").textContent = state.age; fillSlider(ageEl); });
hoursEl.addEventListener("input", function(){ state.hours = +hoursEl.value; $("v-hours").textContent = (+hoursEl.value).toFixed(1); fillSlider(hoursEl); });
fillSlider(ageEl); fillSlider(hoursEl);

$("genre").addEventListener("click", function(e){
  var b = e.target.closest(".chip"); if (!b) return;
  state.genre = b.getAttribute("data-g");
  var all = this.querySelectorAll(".chip");
  for (var i = 0; i < all.length; i++) all[i].classList.toggle("on", all[i] === b);
});
$("skill").addEventListener("click", function(e){
  var b = e.target.closest(".chip"); if (!b) return;
  state.skill = +b.getAttribute("data-s");
  var all = this.querySelectorAll(".chip");
  for (var i = 0; i < all.length; i++) all[i].classList.toggle("on", all[i] === b);
});

$("sim").addEventListener("click", function(){
  result = compute();
  $("inputView").classList.add("gone");
  mode = "converge"; convT = 0;
});
$("retry").addEventListener("click", function(){
  var rv = $("resultView");
  rv.classList.remove("in"); rv.classList.add("hidden");
  $("inputView").classList.remove("gone");
  mode = "ambient";
});

/* taps -> ripples (empty area only; panel/buttons capture their own events) */
cv.addEventListener("pointerdown", function(e){ if (mode !== "converge") addRipple(e.clientX, e.clientY); });
cv.addEventListener("pointermove", function(e){ if (e.pressure > 0 && e.buttons && mode !== "converge") { if (Math.random() < 0.5) addRipple(e.clientX, e.clientY); } });
cv.addEventListener("touchmove", function(e){ e.preventDefault(); }, { passive: false });

/* boot */
document.addEventListener("visibilitychange", function(){
  if (document.hidden){ cancelAnimationFrame(raf); }
  else { last = performance.now(); raf = requestAnimationFrame(frame); }
});
window.addEventListener("resize", resize);
resize();
last = performance.now();
raf = requestAnimationFrame(frame);
})();
</script>
